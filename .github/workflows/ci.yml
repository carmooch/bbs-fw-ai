name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: BBSHD firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SDCC
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      - name: Build
        working-directory: src/firmware
        run: make all TARGET_CONTROLLER=BBSHD

      - name: Memory usage
        working-directory: src/firmware
        run: |
          {
            echo '### BBSHD memory usage'
            echo '```'
            sed -n '/^Other memory:/,$p' bbs-fw.mem
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bbs-fw-BBSHD
          path: src/firmware/bbs-fw.hex
          if-no-files-found: error

  host:
    name: Host tests and ride simulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        working-directory: src/firmware/host
        run: make test

      - name: Ride scenarios
        working-directory: src/firmware/host
        run: |
          echo '### Ride scenarios' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          status=0
          make sim 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Plots
        if: always()
        working-directory: src/firmware/host
        run: make plots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-sim
          path: src/firmware/host/out/

  tool-layout:
    name: Config tool matches firmware layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check C# config tool against the C config_t
        run: src/tool-check/check.sh

  config-tool:
    name: Config tool (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/tool/bbs-fw-tool.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: BBSFWTool
          path: publish/
          if-no-files-found: error

  line-endings:
    name: Line endings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No line-ending-only changes against upstream
        run: scripts/check-eol.sh
