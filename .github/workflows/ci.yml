name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: BBSHD firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SDCC
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      - name: Build
        working-directory: src/firmware
        run: make all TARGET_CONTROLLER=BBSHD

      # effort.c as compiled for the controller, run in an 8051 simulator, must
      # match the PC build the unit tests use, and must not stall the main loop
      - name: 8051 cross-check
        shell: bash   # with pipefail, so a failure isn't hidden by tee
        run: |
          sudo apt-get install -y sdcc-ucsim
          {
            echo '### 8051 cross-check'
            echo '```'
            src/firmware/host/sim51/run.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Memory usage
        working-directory: src/firmware
        run: |
          {
            echo '### BBSHD memory usage'
            echo '```'
            sed -n '/^Other memory:/,$p' bbs-fw.mem
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bbs-fw-BBSHD
          path: src/firmware/bbs-fw.hex
          if-no-files-found: error

  host:
    name: Host tests and ride simulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        working-directory: src/firmware/host
        run: make test

      - name: Ride scenarios
        working-directory: src/firmware/host
        run: |
          echo '### Ride scenarios' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          status=0
          make sim 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Torque-feel benchmark
        if: always()
        working-directory: src/firmware/host
        run: |
          echo '### Torque-feel benchmark (simulator only)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          status=0
          python3 sim/feel.py --floor 50 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Plots
        if: always()
        working-directory: src/firmware/host
        run: make plots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-sim
          path: src/firmware/host/out/

  tool-layout:
    name: Config tool matches firmware layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install stcgal (for the real-stcgal check)
        run: pip install stcgal==1.10

      - name: Config tool against the firmware (layout, bench, flash wizard)
        run: src/tool-check/check.sh

      - name: Live link (bbs-link) against a virtual controller
        run: src/link/check.sh

  config-tool:
    name: Config tool (Windows)
    runs-on: windows-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/tool/bbs-fw-tool.csproj -c Release -o publish

      # BBS-FW-AI, the new tuning workspace beside the config tool: built
      # here so it keeps compiling, not shipped in the release yet
      - name: Build BBS-FW-AI
        run: dotnet build src/app/bbs-fw-ai.csproj -c Release

      # The Update Firmware tab flashes with what's in publish/flash: the
      # firmware from this same commit and stcgal (open-source STC flasher).
      - uses: actions/download-artifact@v4
        with:
          name: bbs-fw-BBSHD
          path: firmware

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle stcgal and the firmware
        shell: pwsh
        run: |
          pip install stcgal==1.10 pyinstaller==6.10.0
          pyinstaller --onefile --name stcgal --distpath publish/flash --workpath build/stcgal --specpath build/stcgal src/tool/flash/stcgal_entry.py
          Copy-Item firmware/bbs-fw.hex publish/flash/bbs-fw-BBSHD.hex
          $h = Get-Content src/firmware/version.h -Raw
          $v = @('MAJOR','MINOR','PATCH') | ForEach-Object { [regex]::Match($h, "VERSION_$_\s+(\d+)").Groups[1].Value }
          ($v -join '.') | Set-Content -NoNewline publish/flash/version.txt
          Copy-Item src/tool/flash/STCGAL-LICENSE.txt publish/flash/

      # bbs-link: the live link for a Claude session on the laptop (LIVE.md),
      # one self-contained exe, no .NET install needed
      - name: Bundle bbs-link
        shell: pwsh
        run: |
          dotnet publish src/link/bbs-link.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/link
          Remove-Item publish/link/*.pdb
          Copy-Item CLAUDE.md, LIVE.md publish/link/

      - name: Check the bundle
        shell: pwsh
        run: |
          $help = & publish/link/bbs-link.exe help
          if (-not ($help -match 'live link')) { throw "bbs-link.exe: $help" }
          & publish/link/bbs-link.exe ports
          # with no controller on the port it keeps waiting, but the dashboard and
          # the command pipe must work on Windows as they do in the Linux check
          $srv = Start-Process publish/link/bbs-link.exe -ArgumentList 'serve','--port','COM99','--log-dir',"$env:RUNNER_TEMP/live" -PassThru -NoNewWindow
          Start-Sleep -Seconds 4
          $page = (Invoke-WebRequest -UseBasicParsing http://localhost:8710/).Content
          if (-not ($page -match 'BBSHD Live')) { throw "dashboard not served" }
          $status = & publish/link/bbs-link.exe status
          if (-not ($status -match 'COM99')) { throw "bbs-link status: $status" }
          & publish/link/bbs-link.exe stop
          if (-not $srv.WaitForExit(10000)) { $srv.Kill(); throw "bbs-link serve didn't stop" }
          $out = & publish/flash/stcgal.exe -V
          if ($out -notmatch 'stcgal 1\.10') { throw "stcgal.exe: $out" }
          $v = Get-Content publish/flash/version.txt
          $tool = (Get-Item publish/BBSFWTool.exe).VersionInfo.FileVersion
          if (-not $tool.StartsWith($v)) { throw "firmware $v but tool $tool" }
          Get-ChildItem publish/flash

      - uses: actions/upload-artifact@v4
        with:
          name: BBSFWTool
          path: publish/
          if-no-files-found: error

  line-endings:
    name: Line endings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No line-ending-only changes against upstream
        run: scripts/check-eol.sh

  # A rolling "latest" release from master, so a Claude session on the laptop
  # (or anyone) can download bbs-link and the firmware without a GitHub
  # login: .../releases/latest/download/bbs-link.exe. On other branches it
  # only assembles and checks the files.
  release:
    name: Release (master)
    runs-on: ubuntu-24.04
    needs: [firmware, host, tool-layout, config-tool, line-endings]
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BBSFWTool
          path: bundle

      - name: Assemble the release files
        run: |
          mkdir release
          cp bundle/link/bbs-link.exe CLAUDE.md LIVE.md release/
          cp bundle/flash/bbs-fw-BBSHD.hex release/
          (cd bundle && zip -qr ../release/BBSFWTool.zip .)
          version=$(cat bundle/flash/version.txt)
          echo "version=$version" >> "$GITHUB_ENV"
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
          test -s release/bbs-link.exe && test -s release/bbs-fw-BBSHD.hex

      - name: Publish
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          bbs-fw $version, built by CI from master at ${GITHUB_SHA::7}. Replaced on every green push to master.

          - **bbs-link.exe**: the live link for a Claude session on the laptop (see LIVE.md). Windows, no install.
          - **BBSFWTool.zip**: the config tool with the firmware and flasher (Update Firmware tab), and bbs-link.
          - **bbs-fw-BBSHD.hex**: the firmware on its own.
          - **CLAUDE.md**, **LIVE.md**: how a live session works. **SHA256SUMS**: checksums.

          Simulator-tested; see ROADMAP.md for what has and hasn't been tried on a bike.
          NOTES
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest --target "$GITHUB_SHA" --title "bbs-fw $version (latest master)" \
            --notes-file notes.md --latest release/*
